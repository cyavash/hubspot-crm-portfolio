<rect x="1038" y="295" width="277" height="306" rx="10" fill="#edf4f1"/><text x="1058" y="333" font-size="19" font-weight="700">Consultation ready</text><text x="1058" y="385" class="label">Follow-up and booking</text><text x="1058" y="415" class="label">Engagement tracked separately</text>
