<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="830" viewBox="0 0 1400 830" role="img" aria-labelledby="t d"><title id="t">Kaplan Law CRM visual sample</title><desc id="d">A fictional contact and enquiry record beside a high-level pipeline overview. No client data.</desc><defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18283b}.muted{fill:#66717c;font-size:17px}.heading{font-size:25px;font-weight:700}.label{font-size:14px;fill:#66717c}.card{fill:white;stroke:#dfe3e8;stroke-width:1.5;rx:12}</style></defs><rect width="1400" height="830" fill="#f6f7f9" rx="16"/><text x="55" y="65" font-size="17" letter-spacing="3">KAPLAN LAW / CRM SAMPLE</text><text x="55" y="121" font-size="36" font-weight="700">One view of the person, the enquiry and the next step.</text>
<rect class="card" x="55" y="172" width="395" height="580"/><circle cx="110" cy="232" r="27" fill="#edf0f4"/><text x="96" y="241" font-size="23">JC</text><text x="155" y="225" class="heading">Jordan Casey</text><text x="155" y="252" class="muted">Synthetic contact</text><path d="M80 288H425" stroke="#e1e5ea"/><text class="label" x="85" y="327">EMAIL</text><text x="85" y="358" font-size="18">jordan@example.com</text><text class="label" x="85" y="407">RECORD OWNER</text><text x="85" y="438" font-size="18">Intake team</text><text class="label" x="85" y="487">ASSOCIATED ENQUIRY</text><text x="85" y="518" font-size="18">Consultation enquiry</text><text class="label" x="85" y="567">NEXT ACTION</text><rect x="82" y="590" width="340" height="78" rx="9" fill="#f8f4eb"/><text x="100" y="623" font-size="18">Complete intake review</text><text x="100" y="648" class="label">Owner task and a clear handoff</text><text x="85" y="712" class="label">Contacts + enquiries + tasks</text>
<rect class="card" x="480" y="172" width="865" height="580"/><text class="heading" x="510" y="222">Enquiry pipeline</text><text class="muted" x="510" y="253">Current stage, responsible team and next action.</text>
